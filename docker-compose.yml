x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql+psycopg://sentinel@postgres:5432/agent_sentinel
  PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER must be set}
  ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
  ENABLE_DEMO_SEED: "false"
  AGENT_SENTINEL_ALLOW_OPEN_REGISTER: ${AGENT_SENTINEL_ALLOW_OPEN_REGISTER:-false}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
  SENTINEL_FAIL_CLOSED: ${SENTINEL_FAIL_CLOSED:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL:-http://localhost:8000/api/v1/auth/google/callback}

x-backend-service: &backend-service
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    <<: *app-environment
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d agent_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    <<: *backend-service
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  celery_worker:
    <<: *backend-service
    environment:
      <<: *app-environment
      WORKER_MODE: core
    command: celery -A app.worker.celery_app worker --loglevel=info --queues=core --hostname=core@%h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --destination core@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery_beat:
    <<: *backend-service
    environment:
      <<: *app-environment
      WORKER_MODE: core
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-core
    depends_on:
      celery_worker:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    profiles: ["analytics"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-}
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a neo4j://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2
    profiles: ["analytics"]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --insecure --user admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  analytics_worker:
    <<: *backend-service
    profiles: ["analytics"]
    environment:
      <<: *app-environment
      WORKER_MODE: analytics
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-}
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-true}
      OPENSEARCH_CA_CERTS: ${OPENSEARCH_CA_CERTS:-}
    command: celery -A app.worker.celery_app worker --loglevel=info --queues=analytics --hostname=analytics@%h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --destination analytics@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  analytics_beat:
    <<: *backend-service
    profiles: ["analytics"]
    environment:
      <<: *app-environment
      WORKER_MODE: analytics
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-analytics
    depends_on:
      analytics_worker:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  opensearch_data:
