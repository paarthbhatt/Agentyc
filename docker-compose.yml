services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    profiles: ["analytics"]
    environment:
      NEO4J_AUTH: REDACTED_NEO4J_AUTH
    ports:
      - "7474:7474"
      - "7687:7687"

  opensearch:
    image: opensearchproject/opensearch:2
    profiles: ["analytics"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: REDACTED_OPENSEARCH_PASSWORD
    ports:
      - "9200:2000"

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:///./agent_sentinel.db
      API_KEY_PEPPER: local-demo-change-me
      ADMIN_API_KEY: local-demo-admin-key
      ENABLE_DEMO_SEED: "true"
      RATE_LIMIT_PER_MINUTE: "240"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Google OAuth placeholders (fill with real values)
      GOOGLE_CLIENT_ID: "REDACTED_GOOGLE_CLIENT_ID"
      GOOGLE_CLIENT_SECRET: "REDACTED_GOOGLE_CLIENT_SECRET"
      OAUTH_REDIRECT_URI: http://localhost:5173/auth/callback
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:5173"
