name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend-tests:
    name: Backend unit and API integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci-tests.db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      RATE_LIMIT_ENABLED: "false"
      ENABLE_DEMO_SEED: "false"
      AGENT_SENTINEL_ALLOW_OPEN_REGISTER: "true"
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-deployment
      API_KEY_PEPPER: ci-only-api-key-pepper-not-for-deployment
      ADMIN_API_KEY: ci-only-admin-key-not-for-deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app tests
      - name: Run backend tests with branch coverage
        working-directory: backend
        run: |
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report --show-missing

  postgres-migrations:
    name: PostgreSQL migration round-trip and drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d agent_sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel-ci-password@localhost:5432/agent_sentinel
      ENABLE_DEMO_SEED: "false"
      RATE_LIMIT_ENABLED: "false"
      AGENT_SENTINEL_ALLOW_OPEN_REGISTER: "true"
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-deployment
      API_KEY_PEPPER: ci-only-api-key-pepper-not-for-deployment
      ADMIN_API_KEY: ci-only-admin-key-not-for-deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install migration dependencies
        working-directory: backend
        run: python -m pip install -r requirements.lock
      - name: Upgrade, downgrade, and re-upgrade PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current --check-heads
          alembic downgrade base
          alembic upgrade head
      - name: Smoke-test the API against migrated PostgreSQL
        working-directory: backend
        run: |
          python - <<'PY'
          import uuid

          from fastapi.testclient import TestClient

          from app.main import app

          with TestClient(app) as client:
              email = f"ci-{uuid.uuid4()}@example.com"
              registered = client.post(
                  "/api/v1/auth/register",
                  json={
                      "email": email,
                      "password": "ci-integration-password-123",
                      "org_name": "CI PostgreSQL Organization",
                  },
              )
              assert registered.status_code == 201, registered.text
              bearer = {"authorization": f"Bearer {registered.json()['access_token']}"}
              created = client.post(
                  "/api/v1/agents",
                  headers=bearer,
                  json={"name": "CI Agent", "role": "test_agent"},
              )
              assert created.status_code == 201, created.text
              agent = created.json()
              event = client.post(
                  "/api/v1/telemetry/events",
                  headers={"x-agent-sentinel-key": agent["api_key"]},
                  json={
                      "agent_id": agent["agent"]["id"],
                      "event_type": "ci.postgres.smoke",
                      "client_event_id": str(uuid.uuid4()),
                  },
              )
              assert event.status_code == 201, event.text
              summary = client.get("/api/v1/dashboard/summary", headers=bearer)
              assert summary.status_code == 200, summary.text
              assert summary.json()["active_agents"] == 1, summary.text
          PY
      - name: Reject model and migration drift
        working-directory: backend
        run: alembic check

  sdk:
    name: Python SDK tests and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Run SDK tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v
      - name: Build and validate distributions
        working-directory: sdk/python
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "from agent_sentinel import AgentSentinelClient, SecurityBlock; assert AgentSentinelClient and SecurityBlock"

  frontend:
    name: Frontend type-check and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    name: Compose validation and core-stack smoke test
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: production
      POSTGRES_PASSWORD: ci-compose-postgres-validation-only
      API_KEY_PEPPER: ci-compose-api-key-pepper-validation-only
      ADMIN_API_KEY: ci-compose-admin-key-validation-only
      JWT_SECRET_KEY: ci-compose-jwt-signing-key-validation-only
      CORS_ORIGINS: https://sentinel.example
      FRONTEND_URL: https://sentinel.example
      OAUTH_CALLBACK_URL: https://sentinel.example/api/v1/auth/google/callback
      NEO4J_AUTH: neo4j/ci-compose-neo4j-validation-only
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Ci-Compose-OpenSearch-Validation-123!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate core and analytics Compose models
        run: |
          docker compose config --quiet
          docker compose --profile analytics config --quiet
      - name: Build application images
        run: docker compose build backend frontend
      - name: Start and health-check the core stack
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Verify frontend health and same-origin API routing
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5173/healthz
          curl --fail --silent --show-error http://127.0.0.1:5173/api/v1/health
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop the core stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    name: High and critical security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
