[project]
name = "agent-sentinel-sdk"
version = "0.1.0"
description = "Python SDK for Agent Sentinel runtime enforcement"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agent Sentinel" }]
license = "Apache-2.0"
keywords = ["ai", "agents", "security", "runtime", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/paarthbhatt/Agentyc"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
