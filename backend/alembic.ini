# Alembic Configuration File
# The gencommand can use templates instead of creating custom .py files
# as the "black template" for new upgrade/downgrade scripts
# By default 'revision' will be used as the file_new_suffix template and set
# file_new_prefix + file_new_suffix by default; it is just used on the new generate command
# to post_write hook. Can be set in alembic/script.py.mako.template_args instead so multi configs
# can share the same scripts directory
# file_new_prefix = ''
# file_new_suffix = ''

[alembic]
script_location = alembic

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost/agent_sentinel


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
