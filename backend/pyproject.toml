[project]
name = "agentyc-backend"
version = "0.1.0"
requires-python = ">=3.11,<4"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP017", "UP037"]

[tool.ruff.lint.per-file-ignores]
# Application settings must see .env before modules instantiate their globals.
"app/main.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
